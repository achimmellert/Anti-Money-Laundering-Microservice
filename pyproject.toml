[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aml"
version = "0.1.0"
description = "Anti-Money-Laundering Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.0",
    "celery>=5.4.0",
    "celery-batches>=0.11",
    "gevent>=23.9.0",
    "redis>=5.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "pandera[polars]>=0.20.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "matplotlib>=3.8.0",
    "joblib>=1.4.0",
    "loguru>=0.7.0",
    "mlflow>=2.11.0",
    "optuna>=3.6.0",
    "msgspec>=0.18.0",
    "requests>=2.31.0",
    "flet>=0.80.0",
    "numba>=0.59.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.17.2",
    "pyrefly>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pandera.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line length violations (formatter takes precedence)
    "B008",   # function call in argument defaults (standard FastAPI pattern)
    "RUF006", # unreferenced asyncio task return values (UI triggers)
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Security",
    "Depends",
]

[tool.pyrefly]
search-path = ["src", "."]
project-excludes = [
    "src/aml/services/model_wrappers.py",
    "tools/**",
]
ignore-missing-imports = [
    "pytorch_tabular",
    "pytorch_tabular.*",
    "flet",
    "flet.*",
]

[tool.pyrefly.errors]
bad-override = false

