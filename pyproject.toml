[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aml"
version = "0.1.0"
description = "Anti-Money-Laundering Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.0",
    "celery>=5.4.0",
    "celery-batches>=0.11",
    "gevent>=23.9.0",
    "redis>=5.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "pandera[polars]>=0.20.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "matplotlib>=3.8.0",
    "joblib>=1.4.0",
    "loguru>=0.7.0",
    "mlflow>=2.11.0",
    "optuna>=3.6.0",
    "msgspec>=0.18.0",
    "requests>=2.31.0",
    "flet>=0.80.0",
    "numba>=0.59.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pandera.*",
]
