global:
  scrape_interval: 15s # How often to pull data

scrape_configs:
  - job_name: 'fastapi'
    static_configs:
      - targets: ['fastapi-app:8000'] # Matches your docker-compose service name

  - job_name: 'celery'
    static_configs:
      - targets: ['celery-exporter:9808'] # We will add this service next